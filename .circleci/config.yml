version: 2.1

executors:
  node:
    docker:
      - image: cypress/base:22.21.0 # Node 22, matching the lambdas' nodejs22.x runtime
    working_directory: /tmp/multipitch

commands:
  install:
    steps:
      # npm ci starts from an empty node_modules, so what is worth keeping is npm's download cache and the Cypress binary
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "package-lock.json" }}
            - v2-dependencies-
      - run:
          name: Install local dependencies
          command: npm ci
      - save_cache:
          key: v2-dependencies-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache/Cypress

# test, webp and lambdas run side by side; deploy waits for all three
jobs:
  test:
    executor: node
    steps:
      - checkout
      - run:
          name: Show current branch
          command: echo ${CIRCLE_BRANCH}
      - install
      # everything but the webp images, which no spec needs
      - run:
          name: Build the climb pages, sitemap, blog and content pages
          command: npm run generate-pages
      - run:
          name: Run Tests
          command: npm run test
      - store_artifacts:
          path: /tmp/multipitch/cypress/videos
          destination: artifact-file
      # what generate-pages wrote, for deploy
      - persist_to_workspace:
          root: .
          paths:
            - website/index.html
            - website/climbs
            - website/sitemap.xml
            - website/blog
            - website/climbing-grades

  webp:
    executor: node
    environment:
      CYPRESS_INSTALL_BINARY: 0   # no tests here
    steps:
      - checkout
      - install
      # the last build's .webp files and the hashes of the sources they were made from,
      # so only new or changed images are converted - see generateWebP.js
      - restore_cache:
          keys:
            - v1-webp-
      - run:
          name: Restore the cached webp images
          command: if [ -f /tmp/webp-cache/webp.tar ]; then tar -xf /tmp/webp-cache/webp.tar; fi
      - run:
          name: Build the webp images
          command: npm run generate-webp
      - run:
          name: Pack the webp images
          command: mkdir -p /tmp/webp-cache && find website/img -name '*.webp' | tar -cf /tmp/webp-cache/webp.tar -T - .webp-hashes.json
      # a new cache only when an image has changed
      - save_cache:
          key: v1-webp-{{ checksum ".webp-hashes.json" }}
          paths:
            - /tmp/webp-cache
      - persist_to_workspace:
          root: /tmp/webp-cache
          paths:
            - webp.tar

  # Lambda suites run on the same Node 22 the lambdas use in AWS (nodejs22.x)
  lambdas:
    executor: node
    steps:
      - checkout
      - run:
          name: Weather lambda tests
          command: cd lambda-node/get-weather && npm ci && npm test
      - run:
          name: Tides lambda tests
          command: cd lambda-node/get-tides && npm ci && npm test

  deploy:
    working_directory: /tmp/multipitch
    docker:
      - image: cimg/aws:2026.07.1
    steps:
      - checkout
      # the generated pages over the checkout, and webp.tar beside it
      - attach_workspace:
          at: /tmp/multipitch
      - run:
          name: Unpack the webp images
          command: tar -xf webp.tar && rm webp.tar
      # Images by size alone, as the checkout makes every file look newer than its copy in the bucket.
      # A new one is cached for a month; one already there keeps what it has.
      # note: --exclude / --include paths are relative to the sync source (website/), not the repo root
      - run:
          name: Deploy images to S3
          command: aws s3 sync website s3://www.multi-pitch.com --delete --size-only --exclude "*" --include "*.jpg" --include "*.webp" --include "*.png" --cache-control max-age=2629746
      - run:
          name: Deploy everything else to S3
          command: aws s3 sync website s3://www.multi-pitch.com --delete --exclude "*.jpg" --exclude "*.webp" --exclude "*.png"
      - run:
          name: Add a file to know which version was deployed
          command: |
            echo "release number: ${CIRCLE_TAG}" >> release.txt
      - run:
          name: Deploy that file
          command: aws s3 cp release.txt s3://www.multi-pitch.com
      - run:
          name: Invalidate CloudFront
          command: aws cloudfront create-invalidation --distribution-id E1WJUCQRX8PD1F --path "/*"
      - run:
          name: Print website url
          command: echo "www.multi-pitch.com"

workflows:
  build_and_deploy:
    jobs:
      # tag filters are required on every job deploy requires, since deploy has them
      - test:
          filters:
            tags:
              only: /^v.*/
      - webp:
          filters:
            tags:
              only: /^v.*/
      - lambdas:
          filters:
            tags:
              only: /^v.*/
      - deploy:
          requires:
            - test
            - webp
            - lambdas
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
