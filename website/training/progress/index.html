<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="Climbing progress from the multi-pitch.com training apps - sport climbs, boulders and trad climbs by grade, over the last year or any time." />
    <link href="../common/style.css" rel="stylesheet" />
    <link href="../common/fontello.css" rel="stylesheet" />
    <link href="../common/page.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <title>Climbing Progress</title>
  </head>
  <body>
    <nav>
        <!-- both sides empty, so the title stays centred -->
        <div class="left-nav"></div>
        <h1>Progress</h1>
        <div class="right-nav"></div>
    </nav>

    <!-- Drawn by charts.js from the apps' logs and an imported UKC logbook, and
         hidden until there is something graded to draw -->
    <section class="performance" id="performance" hidden>
        <div class="picker range-picker" role="radiogroup" aria-label="Time range">
            <input type="radio" name="overviewRange" class="nice-radios" id="range-all" value="all" />
            <label for="range-all">All time</label>
            <input type="radio" name="overviewRange" class="nice-radios" id="range-365" value="365" checked />
            <label for="range-365">Year</label>
            <input type="radio" name="overviewRange" class="nice-radios" id="range-30" value="30" />
            <label for="range-30">30 days</label>
            <input type="radio" name="overviewRange" class="nice-radios" id="range-7" value="7" />
            <label for="range-7">7 days</label>
        </div>
        <figure>
            <figcaption>Climbs by grade</figcaption>
            <p class="sessions-note" id="sportTotal"></p>
            <div id="sportChart"></div>
        </figure>
        <figure>
            <figcaption>Boulders by grade</figcaption>
            <p class="sessions-note" id="boulderTotal"></p>
            <div id="boulderChart"></div>
        </figure>
        <!-- once there is trad to show: from the trad app, or a UKC logbook imported
             there. Until then, the way to import one. -->
        <p class="sessions-note" id="tradPrompt" hidden>
            <a href="../trad/#ukc">Upload UKC log data to combine and add trad climbs</a>
        </p>
        <figure id="tradFigure" hidden>
            <figcaption>Trad climbs by grade</figcaption>
            <p class="sessions-note" id="tradTotal"></p>
            <div id="tradChart"></div>
            <p class="sessions-note" id="ukcNote" hidden>
                <span id="ukcImported"></span><a href="#" onclick="removeUkcLogbook();return false;">Remove</a>
            </p>
        </figure>
    </section>

    <!-- in place of the charts on a device with nothing graded logged yet -->
    <section class="performance" id="progressEmpty" hidden>
        <p class="chart-empty">
            Nothing graded logged yet. Climbs from the Gym Session, Gilford Wall,
            Endurance and Trad Climbing apps are charted here, and so is an imported
            UKC logbook.
        </p>
    </section>

    <script src="../common/gilford-routes.js"></script>
    <script src="../common/ukc.js"></script>
    <script src="../common/bottom-nav.js" defer></script>
    <script src="charts.js"></script>
  </body>
</html>
