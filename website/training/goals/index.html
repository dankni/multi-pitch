<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/training/manifest.json" />
    <meta name="theme-color" content="#121212">
    <!-- iOS has no manifest support worth the name: it wants these, and Add to
         Home Screen by hand from the share sheet -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Training">
    <link rel="apple-touch-icon" href="/img/favicon/apple-icon-180x180.png">
    <link rel="icon" href="/img/favicon/android-icon-192x192.png">
    <link href="/training/common/style.css" rel="stylesheet" />
    <link href="/training/common/fontello.css" rel="stylesheet" />
    <link href="/training/common/page.css" rel="stylesheet" />
    <link href="/training/goals/style.css" rel="stylesheet" />
    <title>Goals</title>
  </head>
  <body>
    <nav>
        <h1>Goals</h1>
    </nav>

    <main class="goals column">
        <!-- the month shown, the one either side to step to -->
        <div class="month-carousel">
            <button type="button" class="step-arrow" id="goalBack" data-action="stepMonth" data-step="-1">
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5"/></svg><span id="goalMonthBefore"></span>
            </button>
            <h2 class="month-shown" id="goalMonth" aria-live="polite"></h2>
            <button type="button" class="step-arrow" id="goalOn" data-action="stepMonth" data-step="1">
                <span id="goalMonthAfter"></span><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3l5 5-5 5"/></svg>
            </button>
        </div>

        <div class="goal-month panel" id="goalMonthPanel">
            <ul class="goal-list" id="goalList"></ul>
            <form class="goal-form" id="goalForm" hidden>
                <div class="field-row">
                    <select class="field" id="goalType" data-change="showGoalForm" aria-label="Goal">
                        <option value="sessions">Sessions</option>
                        <option value="hours">Hours</option>
                        <option value="climbs">Climbs</option>
                    </select>
                    <input type="number" class="field goal-amount" id="goalAmount" min="1" step="1" inputmode="decimal" aria-label="How many" data-input="clearInvalidGoal" />
                </div>
                <fieldset class="goal-apps" id="goalAppsField">
                    <legend>Apps that count</legend>
                    <div class="goal-checks" id="goalChecks"></div>
                    <button type="button" class="link-button" data-action="selectAllGoalApps">Select all</button>
                </fieldset>
                <div class="goal-climbs" id="goalClimbFields">
                    <div class="picker" role="radiogroup" aria-label="Kind of climb">
                        <input type="radio" name="goalKind" class="nice-radios" id="goalKind-any" value="" data-change="showGoalForm" checked />
                        <label for="goalKind-any">Any Climbs</label>
                        <input type="radio" name="goalKind" class="nice-radios" id="goalKind-sport" value="sport" data-change="showGoalForm" />
                        <label for="goalKind-sport">Sport</label>
                        <input type="radio" name="goalKind" class="nice-radios" id="goalKind-boulder" value="boulder" data-change="showGoalForm" />
                        <label for="goalKind-boulder">Bouldering</label>
                    </div>
                    <select class="field" id="goalGrade" aria-label="Lowest grade that counts"></select>
                </div>
                <p class="backup-actions">
                    <button type="button" id="saveGoalButton" data-action="saveGoal">SET GOAL</button>
                </p>
                <p class="goal-cancel">
                    <button type="button" class="link-button" data-action="closeGoalForm">Cancel</button>
                    <button type="button" class="link-button text-link danger-link" id="removeGoalButton" data-action="removeGoal" hidden>Delete</button>
                </p>
            </form>
            <div id="addGoalLine">
                <p class="backup-actions">
                    <button type="button" data-action="openGoalForm">SET A GOAL</button>
                </p>
                <!-- a month ahead with none, after one with some -->
                <p class="goal-cancel" id="copyGoalsLine" hidden>
                    <button type="button" class="link-button" data-action="copyLastMonth">Copy from last month</button>
                </p>
            </div>
        </div>
    </main>

    <aside id="settings" class="overlay">
        <h2>Settings</h2>
        <label class="switch-label">
            <input type="checkbox" data-change="setGoalsCopy" id="goalsCopy" />
            <span class="label-content">
                <svg class="toggle-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 8h11M9.5 4.5 13 8l-3.5 3.5"/>
                    </g>
                </svg> Copy goals forwards <span class="switch-state"></span>
            </span>
        </label>
        <label class="switch-label">
            <input type="checkbox" data-change="toggleDarkMode" id="darkMode" />
            <span class="label-content">
                <i class="demo-icon icon-moon"></i> Dark Mode <span class="switch-state"></span>
            </span>
        </label>
    </aside>

    <script src="/training/common/gilford-routes.js"></script>
    <script src="/training/common/dansloft-routes.js"></script>
    <script src="/training/common/grades.js"></script>
    <script src="/training/common/ukc.js"></script>
    <script src="/training/common/functions.js"></script>
    <script src="/training/common/bottom-nav.js" defer></script>
    <script src="/training/common/charts.js"></script>
    <script src="/training/common/apps.js"></script>
    <script src="/training/common/goals.js"></script>
  </body>
</html>
