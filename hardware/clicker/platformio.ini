; Bluetooth clicker for the training apps (website/training/common/clicker.js)
; ESP32-C3 SuperMini + SSD1306 OLED + KY-040 dial. Open this folder in VS Code with PlatformIO.

[env:clicker]
; pioarduino = Arduino-ESP32 core 3.x (the official platform is stuck on 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.0
